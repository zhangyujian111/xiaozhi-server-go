# xiaozhi-server-go-admin 前端
#
# 转发规则对应 vite.config.ts 的 dev proxy：
#   /api/xz/*     -> xiaozhi-server:8080（剥离���缀）
#   /api/aisaas/* -> ykt-aisaas:8190（剥离前缀）
#   /internal/api, /v1  -> ykt-aisaas:8190
#   /firmware, /healthz, /readyz, /metrics -> xiaozhi-server:8080

upstream xiaozhi_backend {
    server xiaozhi-server:8080;
}

upstream aisaas_backend {
    server ykt-aisaas:8190;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA 路由回退
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 剥离 /api/xz 前缀后转发（对应 vite rewrite）
    location /api/xz/ {
        rewrite ^/api/xz/(.*)$ /$1 break;
        proxy_pass http://xiaozhi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 剥离 /api/aisaas 前缀后转发
    location /api/aisaas/ {
        rewrite ^/api/aisaas/(.*)$ /$1 break;
        proxy_pass http://aisaas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /internal/api {
        proxy_pass http://aisaas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /v1 {
        proxy_pass http://aisaas_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /firmware {
        proxy_pass http://xiaozhi_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /healthz {
        proxy_pass http://xiaozhi_backend;
        proxy_set_header Host $host;
    }

    location /readyz {
        proxy_pass http://xiaozhi_backend;
        proxy_set_header Host $host;
    }

    location /metrics {
        proxy_pass http://xiaozhi_backend;
        proxy_set_header Host $host;
    }
}
